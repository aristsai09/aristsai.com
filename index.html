<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site unavailable</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="theme-color" content="#f7f9fc" />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f7fbff 0%,#eef5fb 100%)}
    main{width:min(560px,100%);padding:48px 36px;border:1px solid #dbe7f1;border-radius:24px;background:rgba(255,255,255,.92);box-shadow:0 24px 70px rgba(55,89,120,.10);text-align:center}
    .dot{width:14px;height:14px;margin:0 auto 22px;border-radius:999px;background:#9ec8e8}
    h1{margin:0;font-size:clamp(2rem,6vw,3.25rem);letter-spacing:-.04em}
    p{margin:16px 0 0;color:#667487;font-size:1rem;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Site currently unavailable.</h1>
    <p>Please check back later.</p>
  </main>
</body>
</html>
